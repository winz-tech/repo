<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>打樣制度決議會議｜穎利科技</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Chakra+Petch:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F6F4;
  --ink:#16161A;
  --dark:#101014;
  --red:#E30613;
  --done:#1F7A4D;
  --wip:#C8811A;
  --sub:#6B6B75;
  --line:#DAD8D4;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{height:100%;background:#0a0a0c;overflow:hidden;}
body{
  font-family:'Noto Sans TC','Microsoft JhengHei','微軟正黑體',sans-serif;
  font-weight:900;
  -webkit-font-smoothing:antialiased;
}
#viewport{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
#stage{
  width:1600px;height:900px;position:relative;
  transform-origin:center center;
  background:var(--paper);
  overflow:hidden;
  box-shadow:0 0 80px rgba(0,0,0,.6);
}

/* ── slide base ── */
.slide{position:absolute;inset:0;padding:72px 96px;display:none;flex-direction:column;}
.slide.on{display:flex;}
.slide.dark{background:var(--dark);}

/* ── signature: skewed red block ── */
.mark{
  display:inline-block;background:var(--red);
  transform:skewX(-18deg);
  padding:6px 18px;
}
.mark>span{display:inline-block;transform:skewX(18deg);color:#fff;
  font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:15px;letter-spacing:3px;}

.eyebrow{display:flex;align-items:center;gap:16px;margin-bottom:26px;}
.eyebrow .txt{font-size:16px;letter-spacing:5px;color:var(--sub);font-weight:700;}
.slide.dark .eyebrow .txt{color:rgba(255,255,255,.42);}

h1{font-size:62px;line-height:1.16;letter-spacing:2px;color:var(--ink);margin-bottom:14px;}
.slide.dark h1{color:#fff;}
h1 em{font-style:normal;color:var(--red);}
.lede{font-size:24px;font-weight:500;line-height:1.75;color:#45454E;max-width:1180px;margin-bottom:34px;}
.slide.dark .lede{color:rgba(255,255,255,.55);}
.slide.dark .lede b{color:#fff;}

.rule{width:64px;height:6px;background:var(--red);margin-bottom:30px;transform:skewX(-18deg);}

/* ── step reveal ── */
.step{opacity:0;transform:translateY(16px);transition:opacity .38s ease,transform .38s ease;}
.step.show{opacity:1;transform:none;}

/* ── cover ── */
.cover{justify-content:center;}
.cover .big{font-size:104px;line-height:1.06;letter-spacing:4px;color:#fff;}
.cover .big em{font-style:normal;color:var(--red);}
.cover .en{font-family:'Chakra Petch',sans-serif;font-weight:600;font-size:19px;
  letter-spacing:7px;color:rgba(255,255,255,.34);margin-top:26px;}
.cover .meta{margin-top:56px;display:flex;gap:14px;flex-wrap:wrap;}
.chip{border:1px solid rgba(227,6,19,.5);color:rgba(255,255,255,.66);
  font-size:14px;letter-spacing:2px;font-weight:700;padding:7px 16px;}
.grid-bg{position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(227,6,19,.055) 1px,transparent 1px),
                   linear-gradient(90deg,rgba(227,6,19,.055) 1px,transparent 1px);
  background-size:64px 64px;}
.glow{position:absolute;top:-220px;right:-180px;width:720px;height:720px;border-radius:50%;
  background:radial-gradient(circle,rgba(227,6,19,.17) 0%,transparent 68%);pointer-events:none;}

/* ── flow strip ── */
.flow{display:flex;align-items:stretch;gap:0;margin-bottom:38px;}
.flow .n{
  flex:1;background:#fff;border:1px solid var(--line);border-right:none;
  padding:20px 14px;text-align:center;position:relative;
}
.flow .n:last-child{border-right:1px solid var(--line);}
.flow .n b{display:block;font-size:20px;color:var(--ink);letter-spacing:1px;}
.flow .n i{display:block;font-style:normal;font-family:'Chakra Petch',sans-serif;
  font-weight:700;font-size:11px;letter-spacing:2px;color:var(--sub);margin-top:6px;}
.flow .n.hot{background:var(--ink);border-color:var(--ink);}
.flow .n.hot b{color:#fff;}
.flow .n.hot i{color:var(--red);}

/* ── pain cards ── */
.pains{display:grid;grid-template-columns:repeat(3,1fr);gap:22px;}
.pain{background:#fff;border-top:6px solid var(--red);padding:26px 24px 28px;
  border-left:1px solid var(--line);border-right:1px solid var(--line);border-bottom:1px solid var(--line);}
.pain .q{font-size:24px;line-height:1.5;color:var(--ink);margin-bottom:12px;}
.pain .a{font-size:16px;font-weight:500;line-height:1.85;color:#5A5A64;}

/* ── question slide ── */
.qwrap{flex:1;display:flex;flex-direction:column;}
.qhead{font-size:52px;line-height:1.25;color:var(--ink);letter-spacing:1px;margin-bottom:10px;}
.qhint{font-size:19px;font-weight:500;color:var(--sub);margin-bottom:34px;}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;flex:1;align-content:start;}
.opts.two{grid-template-columns:repeat(2,1fr);}
.opt{
  background:#fff;border:2px solid var(--line);padding:26px 22px 24px;
  cursor:pointer;transition:all .16s ease;text-align:left;font-family:inherit;
  display:flex;flex-direction:column;gap:12px;min-height:210px;
}
.opt:hover{border-color:#B9B7B2;transform:translateY(-3px);}
.opt .tag{align-self:flex-start;}
.opt .lb{font-size:27px;line-height:1.35;color:var(--ink);letter-spacing:1px;}
.opt .ds{font-size:15px;font-weight:500;line-height:1.75;color:#6B6B75;margin-top:auto;}
.opt.sel{border-color:var(--red);background:#fff;box-shadow:0 12px 30px rgba(227,6,19,.16);}
.opt.sel .lb{color:var(--red);}
.opt:focus-visible{outline:3px solid var(--ink);outline-offset:3px;}

/* ── path slides ── */
.pathhead{display:flex;align-items:flex-start;gap:24px;margin-bottom:8px;}
.pathbadge{font-family:'Chakra Petch',sans-serif;font-weight:700;font-size:74px;
  line-height:.9;color:var(--red);letter-spacing:2px;}
.pathcols{display:grid;grid-template-columns:1fr 1fr;gap:26px;flex:1;}
.pbox{background:#fff;border:1px solid var(--line);padding:26px 26px 28px;}
.pbox.win{border-top:6px solid var(--done);}
.pbox.cost{border-top:6px solid var(--wip);}
.pbox h3{font-size:15px;letter-spacing:4px;color:var(--sub);margin-bottom:18px;}
.pbox ul{list-style:none;}
.pbox li{font-size:20px;font-weight:500;line-height:1.6;color:#33333B;
  padding:11px 0 11px 26px;position:relative;border-bottom:1px dashed #E8E6E2;}
.pbox li:last-child{border-bottom:none;}
.pbox li::before{content:'';position:absolute;left:0;top:19px;width:11px;height:11px;
  background:var(--done);transform:skewX(-18deg);}
.pbox.cost li::before{background:var(--wip);}
.pbox.miss li::before{background:#C4C2BE;}
.pbox.miss{border-top:6px solid #C4C2BE;}

/* ── compare table ── */
.cmp{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);}
.cmp th,.cmp td{padding:17px 20px;border-bottom:1px solid var(--line);text-align:left;}
.cmp thead th{background:var(--ink);color:#fff;font-size:17px;letter-spacing:2px;}
.cmp thead th:nth-child(2),.cmp thead th:nth-child(3){text-align:center;width:290px;}
.cmp td:first-child{font-size:20px;color:var(--ink);}
.cmp td:nth-child(2),.cmp td:nth-child(3){text-align:center;font-size:19px;font-weight:700;}
.cmp tr:last-child td{border-bottom:none;}
.yes{color:var(--done);}
.no{color:#B5B3AE;}
.mid{color:var(--wip);}

/* ── result ── */
.res{display:grid;grid-template-columns:1fr 470px;gap:30px;flex:1;}
.reco{background:var(--ink);color:#fff;padding:36px 38px;display:flex;flex-direction:column;}
.reco .k{font-size:15px;letter-spacing:5px;color:rgba(255,255,255,.4);margin-bottom:16px;}
.reco .v{font-size:60px;line-height:1.18;letter-spacing:1px;}
.reco .v em{font-style:normal;color:var(--red);}
.reco .why{margin-top:24px;font-size:18px;font-weight:500;line-height:1.85;
  color:rgba(255,255,255,.68);border-top:1px solid rgba(255,255,255,.14);padding-top:22px;}
.reco .why b{color:#fff;font-weight:900;}
.answers{background:#fff;border:1px solid var(--line);padding:26px 26px;overflow:hidden;}
.answers h3{font-size:14px;letter-spacing:4px;color:var(--sub);margin-bottom:16px;}
.answers .row{display:flex;justify-content:space-between;gap:14px;
  padding:11px 0;border-bottom:1px dashed #E8E6E2;}
.answers .row:last-child{border-bottom:none;}
.answers .row .q{font-size:15px;font-weight:500;color:#6B6B75;flex:1;}
.answers .row .a{font-size:16px;color:var(--ink);text-align:right;white-space:nowrap;}
.answers .row .a.none{color:#C4C2BE;font-weight:500;}
.copybtn{margin-top:18px;width:100%;padding:14px;background:var(--red);color:#fff;
  border:none;font-family:inherit;font-weight:900;font-size:17px;letter-spacing:2px;
  cursor:pointer;transform:skewX(-18deg);}
.copybtn>span{display:inline-block;transform:skewX(18deg);}
.copybtn:hover{background:#c0050f;}

/* ── chrome ── */
#bar{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.08);z-index:40;}
#bar i{display:block;height:100%;background:var(--red);width:0;transition:width .3s ease;}
#pg{position:fixed;right:22px;bottom:20px;font-family:'Chakra Petch',sans-serif;font-weight:700;
  font-size:14px;letter-spacing:3px;color:rgba(255,255,255,.45);z-index:41;}
#clock{position:fixed;left:22px;bottom:18px;font-family:'Chakra Petch',sans-serif;font-weight:700;
  font-size:14px;letter-spacing:2px;color:rgba(255,255,255,.4);z-index:41;display:none;}
#clock.on{display:block;}
#help{position:fixed;left:50%;transform:translateX(-50%);bottom:16px;font-size:12px;
  font-weight:500;letter-spacing:2px;color:rgba(255,255,255,.26);z-index:41;}

#notes,#ov{position:fixed;inset:0;background:rgba(8,8,10,.96);z-index:60;display:none;
  padding:60px 70px;overflow-y:auto;}
#notes.on,#ov.on{display:block;}
#notes h2,#ov h2{color:#fff;font-size:26px;letter-spacing:3px;margin-bottom:24px;}
#notes .body{color:rgba(255,255,255,.8);font-size:21px;font-weight:500;line-height:2;max-width:1000px;}
#ov .cells{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;}
#ov .cell{border:1px solid rgba(255,255,255,.16);padding:18px 16px;cursor:pointer;
  color:rgba(255,255,255,.72);font-size:16px;line-height:1.5;transition:all .15s;}
#ov .cell:hover{border-color:var(--red);color:#fff;}
#ov .cell.cur{border-color:var(--red);background:rgba(227,6,19,.14);color:#fff;}
#ov .cell i{display:block;font-style:normal;font-family:'Chakra Petch',sans-serif;
  font-size:12px;letter-spacing:2px;color:var(--red);margin-bottom:7px;}

@media (prefers-reduced-motion:reduce){
  .step{transition:none;} .opt{transition:none;}
}
</style>
</head>
<body>

<div id="viewport"><div id="stage"></div></div>
<div id="bar"><i></i></div>
<div id="pg"></div>
<div id="clock">00:00</div>
<div id="help">→ 下一步　← 上一步　↓ 全展開　O 總覽　N 講稿　T 計時　F 全螢幕</div>
<div id="notes"><h2>講稿</h2><div class="body"></div></div>
<div id="ov"><h2>總覽 — 點擊跳頁</h2><div class="cells"></div></div>

<script>
/* ══════════════════════════════════════════
   答案儲存
══════════════════════════════════════════ */
var ANS = {};

var QUESTIONS = {
  q1:'客戶收到樣品後會不會要求再調',
  q2:'一年打幾次樣',
  q3:'打完樣客戶下單的比例',
  q4:'客戶回頭要求重打上次那版',
  q5:'研發多花時間登配方能否接受',
  q6:'現場決議'
};

/* ══════════════════════════════════════════
   投影片
══════════════════════════════════════════ */
var SLIDES = [

/* 0 封面 */
{ nav:'封面', dark:true, note:'開場：今天只決定一件事——打樣要不要建檔管理、管到什麼程度。四個問題現場問，兩條路現場選。',
  html:`
  <div class="grid-bg"></div><div class="glow"></div>
  <div class="slide-inner cover" style="position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;height:100%">
    <div class="eyebrow"><span class="mark"><span>WINZ+</span></span><span class="txt">穎利科技　決議會議</span></div>
    <div class="big">打樣<em>要不要</em><br>建檔管理</div>
    <div class="en">SAMPLE DEVELOPMENT MANAGEMENT</div>
    <div class="meta">
      <div class="chip">現場問答</div>
      <div class="chip">兩條路擇一</div>
      <div class="chip">當場決議</div>
    </div>
  </div>` },

/* 1 現況流程 */
{ nav:'現在怎麼跑', note:'先講現況，讓大家對齊。流程本身沒問題——有單、有核准、有發料。問題在紅色那一段之後。',
  html:`
    <div class="eyebrow"><span class="mark"><span>01</span></span><span class="txt">現況</span></div>
    <h1>現在打樣，是這樣跑的</h1>
    <div class="rule"></div>
    <div class="flow step">
      <div class="n"><b>報價成交</b><i>DEAL</i></div>
      <div class="n"><b>研發開領用單</b><i>REQUEST</i></div>
      <div class="n"><b>老闆核准</b><i>APPROVE</i></div>
      <div class="n"><b>倉庫發料</b><i>ISSUE</i></div>
      <div class="n"><b>打樣</b><i>MAKE</i></div>
      <div class="n hot"><b>寄給客戶</b><i>SHIP</i></div>
    </div>
    <div class="lede step" style="margin-bottom:26px">流程本身是完整的。有申請、有核准、有發料紀錄。<br>
      問題出在最後一格<b style="color:var(--red)">寄出去之後</b>——這罐東西，我們自己就認不出來了。</div>
    <div class="pains step">
      <div class="pain">
        <div class="q">寄出去的那罐<br>是什麼？</div>
        <div class="a">沒有編號、沒有紀錄。要問人。</div>
      </div>
      <div class="pain">
        <div class="q">配方在哪裡？</div>
        <div class="a">在研發的腦袋跟筆記本裡。<br>只有一份，不在公司。</div>
      </div>
      <div class="pain">
        <div class="q">這客戶花了<br>我們多少錢？</div>
        <div class="a">要把領用單一張一張翻出來加。<br>實務上等於沒人算過。</div>
      </div>
    </div>` },

/* 2 現況痛點情境 */
{ nav:'會發生什麼', note:'三個實際情境。第三個特別講給咪姐聽——她核准的時候是盲的，不知道這是第幾次。',
  html:`
    <div class="eyebrow"><span class="mark"><span>02</span></span><span class="txt">現況</span></div>
    <h1>三個<em>已經在發生</em>的狀況</h1>
    <div class="rule"></div>
    <div class="pathcols" style="grid-template-columns:1fr 1fr 1fr">
      <div class="pbox miss step">
        <h3>狀況一</h3>
        <div style="font-size:26px;line-height:1.5;color:var(--ink);margin-bottom:14px">客戶說<br>「上次那個再打一批」</div>
        <div style="font-size:18px;font-weight:500;line-height:1.85;color:#5A5A64">
          上次是哪一版？誰做的？比例多少？<br>
          只能靠回想。想錯了，客戶收到的是另一罐東西。</div>
      </div>
      <div class="pbox miss step">
        <h3>狀況二</h3>
        <div style="font-size:26px;line-height:1.5;color:var(--ink);margin-bottom:14px">客戶下單量產</div>
        <div style="font-size:18px;font-weight:500;line-height:1.85;color:#5A5A64">
          配方要重新問一次、重新建一次。<br>
          比例錯一個，就是整批報廢。</div>
      </div>
      <div class="pbox miss step">
        <h3>狀況三</h3>
        <div style="font-size:26px;line-height:1.5;color:var(--ink);margin-bottom:14px">核准領料的當下</div>
        <div style="font-size:18px;font-weight:500;line-height:1.85;color:#5A5A64">
          看到的只有「研發要領這些料」。<br>
          不知道這客戶已經是第幾次、累積花了多少。</div>
      </div>
    </div>` },

/* 3 分段：先問四件事 */
{ nav:'先問四件事', dark:true, note:'轉場。強調：制度不是我設計的，是根據你們實際遇到什麼來設計的。所以先問。',
  html:`
  <div class="grid-bg"></div>
  <div style="position:relative;z-index:2;display:flex;flex-direction:column;justify-content:center;height:100%">
    <div class="eyebrow"><span class="mark"><span>Q</span></span><span class="txt">現場問答</span></div>
    <h1 style="font-size:76px">先問<em>四件事</em></h1>
    <div class="lede" style="max-width:900px">制度該做多重，取決於你們實際遇到什麼。<br>
      這四題請現場回答，答案會直接決定後面兩條路要選哪一條。</div>
  </div>` },

/* 4 Q1 */
{ nav:'Q1 會不會改', q:'q1', note:'這題最關鍵。如果客戶常常要求改，代表一個案子底下會有很多版，「版本」就是核心，配方一定要記。',
  html:`
    <div class="eyebrow"><span class="mark"><span>Q1</span></span><span class="txt">現場問答</span></div>
    <div class="qwrap">
      <div class="qhead">客戶收到樣品後，<br>會不會要求「<em style="font-style:normal;color:var(--red)">再調一下</em>」？</div>
      <div class="qhint">香味淡一點、稠一點、顏色再深一點——這種來回，常見嗎？</div>
      <div class="opts step">
        <button class="opt" data-q="q1" data-v="常常，來回好幾次" data-s="B2">
          <span class="tag mark"><span>A</span></span>
          <span class="lb">常常<br>來回好幾次</span>
          <span class="ds">一個案子打三五版是常態</span>
        </button>
        <button class="opt" data-q="q1" data-v="偶爾會改一次" data-s="B1">
          <span class="tag mark"><span>B</span></span>
          <span class="lb">偶爾<br>會改一次</span>
          <span class="ds">大多一兩版就定案</span>
        </button>
        <button class="opt" data-q="q1" data-v="幾乎不改，一次過" data-s="A1">
          <span class="tag mark"><span>C</span></span>
          <span class="lb">幾乎不改<br>一次就過</span>
          <span class="ds">照報價講的做，客戶就收了</span>
        </button>
        <button class="opt" data-q="q1" data-v="說不準" data-s="X">
          <span class="tag mark"><span>D</span></span>
          <span class="lb">說不準<br>看客戶</span>
          <span class="ds">沒統計過</span>
        </button>
      </div>
    </div>` },

/* 5 Q2 */
{ nav:'Q2 一年幾次', q:'q2', note:'量的問題。量大，成本累積就可觀，值得做完整的。量小，做太重反而是負擔。',
  html:`
    <div class="eyebrow"><span class="mark"><span>Q2</span></span><span class="txt">現場問答</span></div>
    <div class="qwrap">
      <div class="qhead">一年大概<em style="font-style:normal;color:var(--red)">打幾次樣</em>？</div>
      <div class="qhint">含同一個案子改配方重打的次數</div>
      <div class="opts step">
        <button class="opt" data-q="q2" data-v="30 次以下" data-s="A1">
          <span class="tag mark"><span>A</span></span>
          <span class="lb">30 次<br>以下</span>
          <span class="ds">平均一個月兩三次</span>
        </button>
        <button class="opt" data-q="q2" data-v="30～60 次" data-s="B1">
          <span class="tag mark"><span>B</span></span>
          <span class="lb">30～60 次</span>
          <span class="ds">平均一個月三到五次</span>

/* ══════════════════════════════════════════
   渲染
══════════════════════════════════════════ */
var stage = document.getElementById('stage');
var cur = 0, step = 0;

SLIDES.forEach(function(s, i){
  var d = document.createElement('div');
  d.className = 'slide' + (s.dark ? ' dark' : '');
  d.dataset.idx = i;
  d.innerHTML = s.html;
  stage.appendChild(d);
});
var slideEls = Array.prototype.slice.call(stage.children);

function steps(i){ return slideEls[i].querySelectorAll('.step'); }

function render(){
  slideEls.forEach(function(el,i){ el.classList.toggle('on', i===cur); });
  var st = steps(cur);
  st.forEach(function(e,i){ e.classList.toggle('show', i < step); });
  document.getElementById('pg').textContent =
    String(cur+1).padStart(2,'0') + ' / ' + String(SLIDES.length).padStart(2,'0');
  document.querySelector('#bar i').style.width = ((cur)/(SLIDES.length-1)*100) + '%';
  document.querySelector('#notes .body').textContent = SLIDES[cur].note || '（無講稿）';
  if (SLIDES[cur].result) buildResult();
  restoreSelections();
}

function next(){
  var st = steps(cur);
  if (step < st.length) { step++; render(); return; }
  if (cur < SLIDES.length-1) { cur++; step = 0; render(); }
}
function prev(){
  if (step > 0) { step--; render(); return; }
  if (cur > 0) { cur--; step = steps(cur).length; render(); }
}
function allSteps(){ step = steps(cur).length; render(); }
function goto(i){ cur = i; step = steps(i).length; render(); }

/* ── 選項點擊 ── */
stage.addEventListener('click', function(e){
  var btn = e.target.closest('.opt');
  if (!btn) return;
  var q = btn.dataset.q;
  ANS[q] = { v: btn.dataset.v, s: btn.dataset.s };
  restoreSelections();
});

function restoreSelections(){
  slideEls[cur].querySelectorAll('.opt').forEach(function(b){
    var a = ANS[b.dataset.q];
    b.classList.toggle('sel', !!a && a.v === b.dataset.v);
  });
}

/* ══════════════════════════════════════════
   建議計算
══════════════════════════════════════════ */
function buildResult(){
  var a = 0, b = 0, unknown = 0;
  Object.keys(QUESTIONS).forEach(function(k){
    var r = ANS[k];
    if (!r) { unknown++; return; }
    if (r.s === 'X') { unknown++; return; }
    var n = parseInt(r.s.slice(1), 10);
    if (r.s[0] === 'A') a += n; else b += n;
  });

  var decided = ANS.q6;
  var title, why;

  if (decided && decided.s !== 'X') {
    title = decided.v.indexOf('先 A') === 0
      ? '先做 A<br><em>之後再升級 B</em>'
      : (decided.v.indexOf('B') > -1 ? '走 <em>B</em><br>完整留配方' : '走 <em>A</em><br>只記帳');
    why = '<b>現場拍板：' + decided.v + '</b><br>四題現況問答的傾向是 '
        + (b > a ? '偏 B（完整）' : b < a ? '偏 A（輕量）' : '兩邊持平')
        + '（A ' + a + ' 分 ／ B ' + b + ' 分）。'
        + (unknown ? '<br>有 ' + unknown + ' 題沒有明確答案，建議會後補問。' : '');
  } else if (unknown >= 4) {
    title = '資訊不足<br><em>建議先做 A</em>';
    why = '大部分問題現場答不出來。<br><b>建議：先做 A（半天完成），跑一季後用真實數字再決定要不要升 B。</b>'
        + '<br>A 的資料結構是 B 的基礎，先做 A 不會白工。';
  } else if (b - a >= 3) {
    title = '走 <em>B</em><br>完整留配方';
    why = 'A ' + a + ' 分 ／ B ' + b + ' 分。<br><b>現況明顯需要配方留底</b>——'
        + '客戶會來回、會回頭重打、下單比例高，這些都指向配方不能只在人身上。'
        + (unknown ? '<br>另有 ' + unknown + ' 題待補。' : '');
  } else if (a > b) {
    title = '走 <em>A</em><br>只記帳';
    why = 'A ' + a + ' 分 ／ B ' + b + ' 分。<br><b>現況不需要做到那麼重</b>——'
        + '打樣量或來回頻率不高，先把錢跟次數管起來就有八成效益。'
        + '<br>之後要升 B，資料結構是相容的，不用重做。'
        + (unknown ? '<br>另有 ' + unknown + ' 題待補。' : '');
  } else {
    title = '建議<br><em>先 A 後 B</em>';
    why = 'A ' + a + ' 分 ／ B ' + b + ' 分，兩邊接近。<br>'
        + '<b>建議分兩期：案號先上線（半天），配方那層等大家習慣了再加。</b>'
        + '<br>A 的資料結構是 B 的基礎，分期做不會多花工。'
        + (unknown ? '<br>另有 ' + unknown + ' 題待補。' : '');
  }

  document.getElementById('recoV').innerHTML = title;
  document.getElementById('recoWhy').innerHTML = why;

  var rows = '';
  Object.keys(QUESTIONS).forEach(function(k){
    var r = ANS[k];
    rows += '<div class="row"><span class="q">' + QUESTIONS[k] + '</span>'
          + '<span class="a' + (r ? '' : ' none') + '">' + (r ? r.v : '未回答') + '</span></div>';
  });
  document.getElementById('ansRows').innerHTML = rows;
}

function copyResult(){
  var lines = ['【打樣制度決議會議】' + new Date().toLocaleDateString('zh-TW'), ''];
  Object.keys(QUESTIONS).forEach(function(k){
    lines.push(QUESTIONS[k] + '：' + (ANS[k] ? ANS[k].v : '未回答'));
  });
  lines.push('');
  lines.push('建議：' + document.getElementById('recoV').innerText.replace(/\n/g,' '));
  lines.push(document.getElementById('recoWhy').innerText);
  var txt = lines.join('\n');

  var ta = document.createElement('textarea');
  ta.value = txt;
  ta.style.cssText = 'position:fixed;top:-9999px';
  document.body.appendChild(ta);
  ta.select();
  var ok = false;
  try { ok = document.execCommand('copy'); } catch(e){}
  document.body.removeChild(ta);

  var btn = document.querySelector('.copybtn span');
  btn.textContent = ok ? '已複製 ✓' : '複製失敗';
  setTimeout(function(){ btn.textContent = '複製結論'; }, 1800);
}

/* ══════════════════════════════════════════
   縮放
══════════════════════════════════════════ */
function fit(){
  var s = Math.min(window.innerWidth/1600, window.innerHeight/900);
  stage.style.transform = 'scale(' + s + ')';
}
window.addEventListener('resize', fit);

/* ══════════════════════════════════════════
   總覽 / 講稿 / 計時 / 全螢幕
══════════════════════════════════════════ */
var ov = document.getElementById('ov');
var cells = ov.querySelector('.cells');
SLIDES.forEach(function(s,i){
  var c = document.createElement('div');
  c.className = 'cell';
  c.innerHTML = '<i>' + String(i+1).padStart(2,'0') + '</i>' + s.nav;
  c.onclick = function(){ goto(i); ov.classList.remove('on'); };
  cells.appendChild(c);
});
function syncOv(){
  cells.querySelectorAll('.cell').forEach(function(c,i){ c.classList.toggle('cur', i===cur); });
}

var t0 = null, tTick = null;
function toggleTimer(){
  var el = document.getElementById('clock');
  if (t0) { t0 = null; clearInterval(tTick); el.classList.remove('on'); return; }
  t0 = Date.now(); el.classList.add('on');
  tTick = setInterval(function(){
    var s = Math.floor((Date.now()-t0)/1000);
    el.textContent = String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
  }, 500);
}

document.addEventListener('keydown', function(e){
  var k = e.key.toLowerCase();
  if (k === 'escape') { ov.classList.remove('on'); document.getElementById('notes').classList.remove('on'); return; }
  if (k === 'o') { ov.classList.toggle('on'); syncOv(); return; }
  if (k === 'n') { document.getElementById('notes').classList.toggle('on'); return; }
  if (k === 't') { toggleTimer(); return; }
  if (k === 'f') {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen();
    return;
  }
  if (ov.classList.contains('on')) return;
  if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prev(); }
  else if (e.key === 'ArrowDown') { e.preventDefault(); allSteps(); }
});

document.addEventListener('click', function(e){
  if (e.target.closest('.opt') || e.target.closest('.copybtn')
      || e.target.closest('#ov') || e.target.closest('#notes')) return;
  next();
});

fit();
render();
</script>
</body>
</html>
